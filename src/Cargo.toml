[package]
name = "monitoring-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rumqttc = "0.24"
rustls = "0.23"
openssl = "0.10"
sysinfo = "0.31"
local-ip-address = "0.6"
mac_address = "1.1"
