[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39"
toml="0.8"
rcgen = "0.14.8"
openssl = { version = "0.10", features = ["vendored"] }
